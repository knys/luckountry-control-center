<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCC v2</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><small>LUCKOUNTRY CONTROL CENTER</small><h1>Autonomous Runtime <b>v2</b></h1></div><div id="automation">---</div></header><main><section class="metrics"><article><small>QUEUE DEPTH</small><strong id="queue">-</strong></article><article><small>ACTIVE JOBS</small><strong id="active">-</strong></article><article><small>本日完了</small><strong id="today">-</strong></article><article><small>累計完了</small><strong id="total">-</strong></article><article><small>BALL HOLDER</small><strong id="ball">-</strong></article><article><small>LAST UPDATE</small><strong id="updated">-</strong></article></section><section><h2>運用対象</h2><div id="jobs" class="jobs"></div></section><section class="recent"><h2>直近の完了（最大3件）</h2><div id="completed" class="jobs"></div></section><section><h2>History</h2><form id="filters"><input name="product" placeholder="Product"><input name="repository" placeholder="Repository"><select name="state"><option value="">State</option><option>COMPLETED</option><option>BLOCKED</option><option>WAITING_HUMAN</option></select><input name="issue" type="number" min="1" placeholder="Issue"><input name="from" type="date"><input name="to" type="date"><button>検索</button></form><div id="history" class="jobs"></div><button id="more" type="button">さらに表示</button></section></main><script type="module" src="/app.js"></script></body></html>
